<script>
function renderAnswerKey(){
 const d=window.QUIZ_DATA, p=d.pages, host=document.getElementById('answerKeyContent');
 host.replaceChildren();
 const add=(title,entries)=>{const sec=document.createElement('section');const h=document.createElement('h3');h.textContent=title;sec.append(h);const ol=document.createElement('ol');entries.forEach(v=>{const li=document.createElement('li');li.textContent=String(v);ol.append(li)});sec.append(ol);host.append(sec)};
 add('Page 1 · 填一填',p.page1.data.flatMap(group=>group.questions.map(q=>q.pre+'【'+(group.bank.find(w=>w[0]===q.ans)?.[1]||'—')+'】'+q.post)));
 add('Page 2 · 圈一圈',p.page2.questions.map(q=>q.options[q.answer]));
 add('Page 3 · 简答 (teacher review only)',p.page3.shorts.map(q=>q[1]+' — 教师批改 / Teacher review'));
 add('Page 3 · 对错',p.page3.tfs.map(q=>q[2]?'对':'错'));
 p.page4.sections.forEach((sec,part)=>{const offset=p.page4.sections.slice(0,part).reduce((n,x)=>n+x.items.length,0);add('Page 4 · 听力 · Part '+(part+1)+' / 第'+(part+1)+'部分 · '+sec.title,sec.items.map((q,i)=>q.label+' '+(q.options[p.page4.answerKey[offset+i]]||'Not set')));});
 add('Page 5 · 连一连',p.page5.left.map((q,i)=>q[0]+' → '+p.page5.right[p.page5.keys[i]][0]));
 add('Page 6 · 写一写',p.page6.writing.map(q=>q.answers.join('、')));
 add('Page 6 · 填一填',p.page6.lines.map((q,i)=>q.speaker+'：'+q.parts.map(part=>typeof part==='number'?p.page6.words[p.page6.keys[part]][0]:part).join('')));
 add('Page 7 · 阅读理解',p.page7.questions.map(q=>q[2]===null?'Teacher review / 教师批改':q[2]?'对':'错'));
}
function updateKeyVisibility(){
 const key=document.getElementById('answerKey');const test=document.getElementById('mode').value==='test';
 key.hidden=test&&!submitted;
 if(test&&!submitted)key.open=false;
}

// ===== PAGE NAVIGATION / SCORING =====
// ids = pages that are scored; navIds includes the ungraded Lesson Dialogue.
// Edit navigation carefully: tab data-page must match iframe IDs.
const ids = [1, 2, 3, 4, 5, 6, 7];
const navIds = [1, 2, 'lesson', 3, 4, 5, 6, 7];
let current = 1, submitted = false;
const $ = id => document.getElementById(id);
function frame(i) { return $('page' + i).contentWindow; }
function switchPage(i) { current = i; for (const n of navIds) {
    $('page' + n).classList.toggle('active', n === i);
    const t = document.querySelector('[data-page="' + n + '"]');
    t.classList.toggle('active', n === i);
    t.setAttribute('aria-selected', String(n === i));
} if ($('mode').value === 'practice')
    $('results').classList.remove('show'); $('check').hidden = ($('mode').value === 'test' || i === 'lesson'); }
document.querySelectorAll('[data-page]').forEach(b => b.addEventListener('click', () => switchPage(b.dataset.page === 'lesson' ? 'lesson' : Number(b.dataset.page))));
function allReady() { return ids.every(i => { try {
    return typeof frame(i).workbookScore === 'function';
}
catch (e) {
    return false;
} }); }
// TEST MODE / PRACTICE MODE: controls answer submission and hint visibility.
function setMode() { navIds.forEach(i => { try {
    frame(i).workbookLockHints($('mode').value === 'test');
}
catch (e) { } }); submitted = false; let test = $('mode').value === 'test'; $('submit').hidden = !test; $('check').hidden = test || current === 'lesson'; $('note').textContent = test ? 'Test Mode: all page results stay hidden until Submit All.' : 'Practice Mode: check each page and try again. Short answers are not automatically scored.'; $('results').classList.remove('show'); $('submit').disabled = false; updateKeyVisibility(); ids.forEach(i => { try {
    frame(i).workbookSetMode(test ? 'test' : 'practice');
}
catch (e) {
    $('page' + i).addEventListener('load', () => frame(i).workbookSetMode(test ? 'test' : 'practice'), { once: true });
} }); }
$('mode').addEventListener('change', setMode);
$('check').addEventListener('click', () => { if (current === 'lesson')
    return; try {
    let w = frame(current);
    w.workbookSubmit();
    let s = w.workbookScore();
    $('results').textContent = 'Page ' + current + ': ' + s.correct + ' / ' + s.total + ' correct' + (s.review ? ' · ' + s.review + ' ungraded question(s)' : '');
    $('results').classList.add('show');
}
catch (e) {
    $('results').textContent = 'Page is still loading. Please try again.';
    $('results').classList.add('show');
} });
// ===== QUIZ NAME: CHANGE THIS FOR EACH NEW LESSON =====
const QUIZ_NAME = () => window.QUIZ_DATA?.meta?.quizName || 'Unnamed Quiz';

// ===== GOOGLE FORM RESULT TRACKING: EDIT HERE =====
// Paste a NEW Google Form URL only if you change forms.
// The entry IDs below come from the teacher's prefilled Google Form link.
// Posts use an invisible iframe, keeping students on this workbook.
const GOOGLE_FORM = () => window.QUIZ_DATA?.googleForm || null;

// Avoid redirects or a visible Google Form; standard HTML form submission
// does not need fetch() and is more compatible with cross-origin restrictions.
function sendToGoogleForm(values) {
    // SAFETY CHECK: Never submit results while in Practice Mode.
    // Google Form tracking is exclusively for Test Mode submissions.
    if (document.getElementById('mode').value !== 'test' || !GOOGLE_FORM()?.action) {
        return false;
    }
    let target = document.getElementById('googleFormTarget');
    if (!target) {
        target = document.createElement('iframe');
        target.id = 'googleFormTarget';
        target.name = 'googleFormTarget';
        target.title = 'Hidden results submission';
        target.style.display = 'none';
        document.body.appendChild(target);
    }
    const form = document.createElement('form');
    form.action = GOOGLE_FORM().action;
    form.method = 'POST';
    form.target = target.name;
    form.acceptCharset = 'UTF-8';
    form.style.display = 'none';
    for (const [key, value] of Object.entries(values)) {
        const input = document.createElement('input');
        input.name = key;
        input.value = String(value);
        form.appendChild(input);
    }
    document.body.appendChild(form);
    form.submit();
    form.remove();
    // Google Forms does not offer cross-origin confirmation to this HTML file.
    // Confirm receipt by checking the Google Form response sheet.
}

// Submit All is only visible in Test Mode. This guard also blocks manual calls in Practice Mode.
$('submit').addEventListener('click', () => {
    if (submitted || $('mode').value !== 'test') return;
    const name = $('student').value.trim();
    const classroom = $('classroom').value.trim();
    if (!name || !classroom) {
        $('results').textContent = 'Enter your Name / 姓名 and Class / 班级 before submitting.';
        $('results').classList.add('show');
        (!name ? $('student') : $('classroom')).focus();
        return;
    }
    if (!allReady()) {
        $('results').textContent = 'Pages are still loading; please try again shortly.';
        $('results').classList.add('show');
        return;
    }

    // All questions count in TOTAL, including teacher-review items.
    // Only objectively graded correct answers count in CORRECT.
    let total = 0, correct = 0, review = 0, gradedTotal = 0;
    const lines = [], pageResults = {}, teacherItems = [];
    for (const i of ids) {
        const rows = frame(i).workbookAnswers();
        const scored = rows.filter(r => !r.review);
        const pageCorrect = scored.filter(r => r.correct).length;
        const pageReview = rows.length - scored.length;
        total += rows.length;
        correct += pageCorrect;
        gradedTotal += scored.length;
        review += pageReview;
        frame(i).workbookSubmit();
        const header = 'Page ' + i + ': ' + pageCorrect + ' / ' + rows.length +
            ' correct (' + scored.length + ' auto-graded, ' + pageReview + ' teacher review)';
        const details = rows.map((r, j) => {
            const status = r.review ? 'TEACHER REVIEW' : (r.correct ? 'CORRECT' : 'WRONG');
            if (r.review) {
                // Store structured review items, so each page heading is printed only once.
                teacherItems.push({
                    page: i,
                    section: r.section || 'Teacher review',
                    question: j + 1,
                    prompt: r.question,
                    response: r.response
                });
            }
            // Format each question consistently with Teacher Review:
            // Q1 [CORRECT]: Question text Answer: student's response ||
            // Include the answer key for automatically graded questions.
            const answerKey = r.review ? '' : ' | Correct: ' + r.expected;
            return 'Q' + (j + 1) + ' [' + status + ']: ' + r.question +
                ' Answer: ' + r.response + answerKey;
        });
        // Separate the page heading and every individual question with ||.
        pageResults[i] = [header, ...details].join(' || ');
        lines.push(header);
    }
    // Group teacher-review answers by page and section without repeating headings.
    const reviewGroups = [];
    for (const item of teacherItems) {
        let group = reviewGroups.find(g => g.page === item.page && g.section === item.section);
        if (!group) {
            group = { page: item.page, section: item.section, questions: [] };
            reviewGroups.push(group);
        }
        group.questions.push('Q' + item.question + ': ' + item.prompt + ' Answer: ' + item.response);
    }
    const reviewText = reviewGroups.length
        ? reviewGroups.map(g => 'Page ' + g.page + ' — ' + g.section + ' | ' + g.questions.join(' || ')).join(' // ')
        : 'None';

    const values = {
        [GOOGLE_FORM().student]: name,
        [GOOGLE_FORM().classroom]: classroom,
        [GOOGLE_FORM().quizName]: QUIZ_NAME(),
        [GOOGLE_FORM().total]: total,
        [GOOGLE_FORM().correct]: correct,
        [GOOGLE_FORM().details]: [
            'Quiz: ' + QUIZ_NAME(),
            'Student: ' + name,
            'Class: ' + classroom,
            'Correct (auto-graded): ' + correct,
            'Total questions (including teacher review): ' + total,
            'Auto-graded questions: ' + gradedTotal,
            'Auto-graded wrong or blank: ' + (gradedTotal - correct),
            'Teacher review pending: ' + review,
            '=== TEACHER REVIEW BY PAGE AND QUESTION ===',
            reviewText
        ].join(' / ')
    };
    for (const i of ids) values[GOOGLE_FORM().pages[i]] = pageResults[i];

    submitted = true;
    updateKeyVisibility();
    $('submit').disabled = true;
    try {
        sendToGoogleForm(values);
        $('results').textContent = 'Overall: ' + correct + ' verified correct out of ' + total + ' questions (' + review + ' teacher review pending).  ' + lines.join('  |  ') + '  Results sent to Google Forms (receipt cannot be verified here; check the Form responses).';
    } catch (error) {
        submitted = false;
        $('submit').disabled = false;
        $('results').textContent = 'Could not send results. Check the internet connection and try again. Overall: ' + correct + ' / ' + total;
    }
    $('results').classList.add('show');
});
$('hide').addEventListener('click', () => { $('results').classList.remove('show'); ids.forEach(i => { try {
    frame(i).workbookHide();
}
catch (e) { } }); });
window.addEventListener('beforeunload', () => { });
navIds.forEach(i => $('page' + i).addEventListener('load', () => { try {
    frame(i).workbookLockHints($('mode').value === 'test');
}
catch (e) { } }));
</script>

<script>
// Every embedded page grows to its content height, just like the former Page 7.
// ResizeObserver catches changes from showing Pinyin, English, answer feedback,
// expanding question content, window resizing, and newly loaded lesson data.
(function () {
    const pages = [...document.querySelectorAll('iframe.page')];
    const observers = new WeakMap();
    function fitPage(page) {
        try {
            const doc = page.contentDocument;
            if (!doc || !doc.body) return;
            const body = doc.body, root = doc.documentElement;
            body.style.maxWidth = '100%';
            body.style.overflowX = 'hidden';
            root.style.overflowX = 'hidden';
            // Measure the actual document, not a viewport-sized iframe.
            const height = Math.max(
                body.scrollHeight, root.scrollHeight,
                body.offsetHeight, root.offsetHeight
            );
            if (height > 100 && page.style.height !== (height + 12) + 'px') {
                page.style.height = (height + 12) + 'px';
            }
        } catch (err) { /* iframe is not initialized yet */ }
    }
    function attach(page) {
        try {
            const doc = page.contentDocument;
            if (!doc || !doc.body) return;
            const style = doc.createElement('style');
            style.textContent = 'html,body{max-width:100%;overflow-x:hidden!important}main,.sheet{min-width:0;max-width:100%!important}.passage-line,.qline,.q,.choices{max-width:100%;min-width:0}.passage-line .han,.qline .han{min-width:0;overflow-wrap:anywhere}.choices{flex-wrap:wrap!important}.passage-line{align-items:flex-start}';
            doc.head.append(style);
            const prior = observers.get(page);
            if (prior) prior.disconnect();
            if (typeof ResizeObserver !== 'undefined') {
                const observer = new ResizeObserver(() => fitPage(page));
                observer.observe(doc.body);
                observers.set(page, observer);
            }
            doc.addEventListener('click', () => requestAnimationFrame(() => fitPage(page)));
            doc.addEventListener('input', () => requestAnimationFrame(() => fitPage(page)));
            fitPage(page);
        } catch (err) { /* fallback to the load event */ }
    }
    for (const page of pages) {
        page.addEventListener('load', () => attach(page));
        const tab = document.querySelector('[data-page="' + page.id.slice(4) + '"]');
        if (tab) tab.addEventListener('click', () => requestAnimationFrame(() => fitPage(page)));
    }
    window.addEventListener('resize', () => pages.forEach(fitPage));
})();
</script>

</style></head><body><select aria-label="Internal grading mode" hidden="" id="mode"><option value="practice">Practice</option><option value="test">Test</option></select><span hidden="" id="modeNote"></span>
<main><div class="sheet"><div class="heading"><h2>第二课 · 综合验测</h2><span>Page 7 · Printed p. 15</span></div><div class="toggles" style="margin-top:18px"><button aria-pressed="false" class="toggle" id="pinyin">拼音 / Pinyin: OFF</button><button aria-pressed="false" class="toggle" id="english">英文 / English: OFF</button></div>
<h3 class="reading-title">V. 阅读理解：请先读下文，再写出对或错。</h3><p class="translation">Read the passage and then mark each statement True (对) or False (错).</p><div class="passage-controls"><button class="primary" id="readAll" type="button">▶ Read All Passage / 朗读全文</button><button class="secondary" id="stop" type="button">■ Stop / 停止</button></div><div id="passage"></div><h3 class="reading-title">根据短文，选出对或错。</h3><div id="questions"></div><div class="actions"><button class="primary" id="check">Check This Page / 检查本页</button><button class="secondary" id="hide">Hide Results</button><span aria-live="polite" id="result" role="status"></span></div></div></main>
<script>
// ===== EDITABLE CONTENT: PAGE 7: Reading comprehension =====
// Edit the passage and question data. Layout adjustment lives in the OUTER page at the bottom.
const PY = parent.QUIZ_DATA.pages.page7.PY, passages = parent.QUIZ_DATA.pages.page7.passages, questions = parent.QUIZ_DATA.pages.page7.questions;
const answers = Array(questions.length).fill(null);
let graded = false, submitted = false, active = -1, session = 0;
function ru(s) { return [...s].map(ch => /\\p{Script=Han}/u.test(ch) ? '<ruby>' + ch + '<rt>' + (PY[ch] || '') + '</rt></ruby>' : ch).join(''); }
function voice() { return speechSynthesis.getVoices().find(v => v.lang.toLowerCase().startsWith('zh')); }
function speak(s, onEnd) { if (!('speechSynthesis' in window))
    return; speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(s); u.lang = 'zh-CN'; u.rate = .84; let v = voice(); if (v)
    u.voice = v; u.onend = () => onEnd && onEnd(); u.onerror = () => onEnd && onEnd(); speechSynthesis.speak(u); }
function audio(s) { const b = document.createElement('button'); b.className = 'audio'; b.textContent = '🔊'; b.type = 'button'; b.setAttribute('aria-label', 'Read Chinese sentence'); b.onclick = () => { stop(); speak(s); }; return b; }
passages.forEach(([zh, en], i) => { let row = document.createElement('div'); row.className = 'passage-line'; row.dataset.n = i; let span = document.createElement('span'); span.className = 'han'; span.innerHTML = ru(zh); row.append(span, audio(zh)); let eng = document.createElement('div'); eng.className = 'passage-en'; eng.textContent = en; row.append(eng); document.getElementById('passage').append(row); });
function highlight(i) { document.querySelectorAll('.passage-line').forEach((r, n) => r.classList.toggle('speaking', i === n)); }
function stop() { session++; if ('speechSynthesis' in window)
    speechSynthesis.cancel(); highlight(-1); }
function playLine(i, token) { if (token !== session)
    return; if (i >= passages.length) {
    highlight(-1);
    return;
} highlight(i); speak(passages[i][0], () => { if (token === session)
    playLine(i + 1, token); }); }
document.getElementById('readAll').onclick = () => { stop(); playLine(0, session); };
document.getElementById('stop').onclick = stop;
questions.forEach(([zh, en], i) => { let row = document.createElement('div'); row.className = 'q'; row.innerHTML = '<div class="qline"><strong>' + (i + 1) + '.</strong><span class="han">' + ru(zh) + '</span></div>'; row.querySelector('.qline').append(audio(zh)); let opts = document.createElement('div'); opts.className = 'choices'; [true, false].forEach(val => { let b = document.createElement('button'); b.type = 'button'; b.className = 'choice'; b.textContent = val ? '对' : '错'; b.setAttribute('aria-pressed', 'false'); b.onclick = () => { if (submitted)
    return; answers[i] = val; hide(); renderChoices(); }; b.dataset.val = String(val); opts.append(b); }); row.append(opts); const tr = document.createElement('p'); tr.className = 'qen'; tr.textContent = en; row.append(tr); document.getElementById('questions').append(row); });
function renderChoices() { document.querySelectorAll('.q').forEach((row, i) => { row.querySelectorAll('.choice').forEach(b => { let isSelected = String(answers[i]) === b.dataset.val; b.classList.toggle('selected', isSelected); b.setAttribute('aria-pressed', String(isSelected)); b.classList.remove('good', 'bad'); if (graded && questions[i][2] !== null && isSelected)
    b.classList.add(answers[i] === questions[i][2] ? 'good' : 'bad'); }); }); }
function hide() { graded = false; document.getElementById('result').textContent = ''; renderChoices(); }
document.getElementById('hide').onclick = hide;
document.getElementById('check').onclick = () => { graded = true; renderChoices(); let n = questions.filter(q => q[2] !== null).length, sc = answers.filter((a, i) => questions[i][2] !== null && a === questions[i][2]).length, blank = answers.filter(a => a === null).length; document.getElementById('result').textContent = 'Score: ' + sc + ' / ' + n + ' · ' + blank + ' unanswered. Q3: teacher review (not explicitly stated in the passage).'; if (document.getElementById('mode').value === 'test') {
    submitted = true;
    document.querySelectorAll('.choice').forEach(b => b.disabled = true);
    document.getElementById('check').disabled = true;
} };
document.getElementById('mode').onchange = e => { submitted = false; document.querySelectorAll('.choice').forEach(b => b.disabled = false); document.getElementById('check').disabled = false; document.getElementById('check').textContent = e.target.value === 'test' ? 'Submit All / 提交全部' : 'Check This Page / 检查本页'; document.getElementById('modeNote').textContent = e.target.value === 'test' ? 'No feedback until Submit All.' : 'Check answers and retry in Practice Mode.'; hide(); };
for (const id of ['pinyin', 'english'])
    document.getElementById(id).onclick = e => { const on = e.currentTarget.getAttribute('aria-pressed') !== 'true'; e.currentTarget.setAttribute('aria-pressed', String(on)); e.currentTarget.textContent = (id === 'pinyin' ? '拼音 / Pinyin' : '英文 / English') + ': ' + (on ? 'ON' : 'OFF'); document.body.classList.toggle(id === 'pinyin' ? 'pinyin-on' : 'english-on', on); };
renderChoices();
<\/script><script>
// GRADING BRIDGE: the main workbook uses these helpers. Avoid changing unless updating grading.
// STUDENT ANSWER REPORT: captured at Test Mode submission.
window.workbookAnswers = function () {
return questions.map((q,i) => ({
 question: 'Q'+(i+1)+': '+q[0],
 response: answers[i] === null ? '(blank)' : answers[i] ? '对' : '错',
 expected: q[2] === null ? 'Teacher review' : q[2] ? '对' : '错',
 review: q[2] === null,
 correct: q[2] !== null && answers[i] === q[2]
}));
};
window.workbookScore = () => ({ correct: answers.filter((a, i) => questions[i][2] !== null && a === questions[i][2]).length, total: questions.filter(q => q[2] !== null).length, review: questions.filter(q => q[2] === null).length });
window.workbookSetMode = (m) => { const el = document.getElementById('mode'); el.value = m; el.dispatchEvent(new Event('change', { bubbles: true })); };
window.workbookSubmit = () => { document.getElementById('check').click(); return window.workbookScore(); };
window.workbookHide = () => { document.getElementById('hide').click(); };
window.addEventListener('message', (e) => { if (e.data?.kind === 'workbookMode')
    window.workbookSetMode(e.data.mode); });
<\/script><script>
(function () {
    // TEST MODE: hides/disables Pinyin and English until Practice Mode is selected.
    window.workbookLockHints = function (test) {
        for (const id of ['pinyin', 'english']) {
            const b = document.getElementById(id);
            if (!b)
                continue;
            if (test) {
                // Turn off visible hints before locking the controls.
                document.body.classList.remove('pinyin-on', 'english-on', 'show-pinyin', 'show-english');
                b.setAttribute('aria-pressed', 'false');
                if (/:\\s*(ON|OFF)/i.test(b.textContent))
                    b.textContent = b.textContent.replace(/:\\s*(ON|OFF)/i, ': OFF');
            }
            b.disabled = Boolean(test);
            b.setAttribute('aria-disabled', String(Boolean(test)));
            b.title = test ? 'Unavailable in Test Mode' : '';
            b.style.opacity = test ? '0.45' : '';
            b.style.cursor = test ? 'not-allowed' : '';
        }
    };
})();
<\/script></body></html>`;

}

// Central answer mapping for every lesson. The JSON pages contain questions only.
function applyAnswerSection(data) {
 const p=data.pages, a=data.answers;
 if (!a) throw Error('Missing answers section at bottom of quiz-data.json');
 const requireLength=(values,count,label)=>{
   if(!Array.isArray(values)||values.length!==count)throw Error('Invalid answers.'+label+': expected '+count+' entries');
   return values;
 };
 requireLength(a.page1.groups,p.page1.data.length,'page1.groups');
 p.page1.data.forEach((group,g)=>{
   const entry=a.page1.groups[g];
   if(entry.name!==group.name)throw Error('Answer group mismatch for '+group.name);
   requireLength(entry.correctLetters,group.questions.length,'page1 '+group.name)
     .forEach((answer,i)=>{group.questions[i].ans=answer;});
 });
 requireLength(a.page2.correctOptionIndexes,p.page2.questions.length,'page2')
   .forEach((answer,i)=>{p.page2.questions[i].answer=answer;});
 // Page 3 short answers are open-ended and require teacher review; no suggested answers.
 requireLength(a.page3.trueFalse,p.page3.tfs.length,'page3.tfs')
   .forEach((answer,i)=>{p.page3.tfs[i].splice(2,0,answer);});
 requireLength(a.page4.parts,p.page4.sections.length,'page4.parts');
 p.page4.answerKey=a.page4.parts.flatMap((part,i)=>{
   if(part.title!==p.page4.sections[i].title)throw Error('Page 4 part title mismatch: '+i);
   return requireLength(part.correctOptionIndexes,p.page4.sections[i].items.length,'page4.part'+(i+1));
 });
 p.page5.keys=requireLength(a.page5.matchingRightIndexes,p.page5.left.length,'page5');
 requireLength(a.page6.writingCharacters,p.page6.writing.length,'page6.writing')
   .forEach((answer,i)=>{p.page6.writing[i].answers=answer;});
 p.page6.keys=requireLength(a.page6.dialogueWordIndexes,p.page6.words.length,'page6.dialogue');
 requireLength(a.page7.trueFalse,p.page7.questions.length,'page7')
   .forEach((answer,i)=>{p.page7.questions[i].splice(2,0,answer);});
}

fetch('./quiz-data.json', {cache:'no-store'})
 .then(r=>{if(!r.ok)throw Error('quiz-data.json HTTP '+r.status);return r.json()})
 .then(data=>{
   // Answer values are stored only in quiz-data.json > answers, at the very end.
   // Reconstruct the page-engine view in memory to keep the existing UI, scoring,
   // Google Form reporting, and the bottom Answer Key working without duplicates in JSON.
   applyAnswerSection(data);
   window.QUIZ_DATA=data;
   document.title=data.meta?.title || document.title;
   document.querySelector('h1').textContent=data.meta?.title||document.querySelector('h1').textContent;
   document.querySelector('.sub').textContent=data.meta?.subtitle||'';
   initializePages();
   renderAnswerKey();
   setMode();
 })
 .catch(e=>{
   const el=document.getElementById('results');el.textContent='Cannot load quiz-data.json: '+e.message+'. Open from a website or local server; keep the JSON beside index.html.';el.classList.add('show');
 });
</script>
